<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bootstrap Forms               </title>

 <link rel="stylesheet" type="text/css"  href="style.css">

        <!--  BOOTSTRAP  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>





</head>
<body>
    
     <div class="container ">
  <form action="" method="post">

        <h2 class="text-center  text-dark" >Custom Sneaker Order Form</h2>

        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput form-control
        ">
    
        <label for="form-email" class="form-label" >Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput form-control"
        >

        <label for="form-tel" class="form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

        <label for="form-story" class="form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long" class="textinput form-control"></textarea>
        <br>
        <label for="sizes  ">Size:</label>
        <select name="size" id="sizes" class="form-select
        ">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
            <option>14</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label class="form-check-label"><input type="radio" name="color" value="red"class="form-check-input"> Red </label>
            <label class="form-check-label"> <input type="radio" name="color" value="blue"class="form-check-input" > Blue</label> 
            <label class="form-check-label"><input type="radio" name="color" value="black"class="form-check-input" > Black</label> 
            <label class="form-check-label"><input type="radio" name="color" value="silver" class="form-check-input"> Silver</label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">
            <legend>Feature</legend>
            <label class="form-check-label"><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            <label class="form-check-label"><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            <label class="form-check-label"><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
            <label class="form-check-label"><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>
        </fieldset>
            
 

        <button type="button" class="btn btn-info mt-3" value="ENTER">ENTER</button>   
    </form>

    </div>















</body>
</html>
